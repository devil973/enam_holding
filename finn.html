.sl{display:block;margin:14px 16px}.sl b{color:var(--hi)}input[type=range]{width:100%;accent-color:var(--g)}
input[type=text]{width:calc(100% - 32px);margin:8px 16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--s);color:var(--hi);font:inherit}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.on{display:flex}

@keyframes u{from{transform:translateY(40px);opacity:.5}}@media (prefers-reduced-motion:reduce){#sc{animation:none}}
.big{font-size:28px;font-weight:700;color:var(--hi)}.bub{margin:8px 16px;padding:10px 12px;border-radius:12px;background:var(--s)}.bub.me{background:var(--hi);color:var(--bg);margin-left:60px}
.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 16px}
.ic{position:relative}.bd{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;border-radius:9px;font-size:10px;min-width:16px;padding:1px 4px}
#tt{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--hi);color:var(--bg);padding:8px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#tt.on{opacity:1}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
</style></head><body>

const D={RELIANCE:["Reliance Industries",2912,1.2,1.1,"Energy",10,2640],TCS:["Tata Consultancy",4108,-.4,.9,"IT",5,3850],HDFCBANK:["HDFC Bank",1687,.8,1,"Banks",20,1590],INFY:["Infosys",1842,-3.6,2.4,"IT",15,1720],ITC:["ITC",462,.3,.8,"FMCG",100,410],SUNPHARMA:["Sun Pharma",1796,2.1,1.6,"Pharma",8,1650],TATAMOTORS:["Tata Motors",1004,-1.9,2.9,"Auto",25,940],LT:["Larsen & Toubro",3644,.9,1.2,"Capital goods",6,3300],BHARTIARTL:["Bharti Airtel",1648,.5,1,"Telecom",12,1500],ASIANPAINT:["Asian Paints",2318,-2.4,1.8,"Paints",7,2500],MARUTI:["Maruti Suzuki",12480,1.1,1.1,"Auto",2,11900],ADANIPORTS:["Adani Ports",1402,4.8,3.1,"Infra",15,1180],TITAN:["Titan",3422,-.7,.9,"Consumer",6,3200],NESTLEIND:["Nestle India",2264,.2,.7,"FMCG",10,2400],ZOMATO:["Zomato",268,3.3,2.2,"Internet",120,210]};

{id:2,t:"ADANIPORTS",c:"management_change",h:9,x:"New CFO appointed, joins next month",y:"Finance chief changes often precede capital plans.",b:"Incoming CFO (sample: A. Rao). 18 years in finance, last group treasurer at a listed infra company. Chartered accountant."},

{id:10,t:"RELIANCE",c:"unclassified",h:3,x:"ESOP allotment"},{id:11,t:"TCS",c:"unclassified",h:15,x:"Compliance certificate"},{id:12,t:"TITAN",c:"unclassified",h:50,x:"Auditor appointment"},{id:13,t:"MARUTI",c:"agm_egm",h:80,x:"AGM notice"}];
const R={INFY:{n:"Infosys",s:"IT services for large enterprises, mostly in North America and Europe.",seg:[["Financial services",28],["Manufacturing",15],["Retail",14],["Communication",12],["Energy and utilities",12],["Other",19]],fin:[["Revenue","₹1,63,000 cr"],["EBITDA margin","24.0%"],["PAT","₹24,800 cr"],["ROCE","38%"]],tr:{rev:[100,122,147,154,163],m:[26.4,25.1,21.1,20.7,21.1]},bs:[["Debt to equity","0.08",1],["Cash and investments","₹40,000 cr",1],["Receivable days","74",0],["Funding","Internal accruals, almost no borrowing",1]],cash:[["FY23",24.1,22.3],["FY24",26,24.1],["FY25",27.5,24.8]],nv:[["Says demand is stable; revenue growth held near 6%.",1],["Says margins are recovering; margin has been flat for two years.",0],["Says the deal pipeline is strong; large-deal wins were flat.",0]],
rows:[["Revenue growth","4–7%","6.3%",1,"Q2 concall p.4"],["Operating margin","20–22%","21.1%",1,"Q1 concall p.6"],["Large-deal wins","Strong pipeline","Flat YoY",0,"Q3 concall p.8"],["Attrition","Below 13%","14.2%",0,"Q4 concall p.5"]],bull:["Margin guidance met two quarters running","Steady growth in a soft demand cycle","Almost no debt"],bear:["Deal momentum lags management’s tone","Attrition above target","Margins flat for two years"],qa:{attrition:["Management guided attrition below 13%; the latest quarter showed 14.2%.","Q4 concall p.5"],margin:["Guided 20–22% operating margin; delivered 21.1%.","Q1 concall p.6"],deal:["Pipeline described as strong, but large-deal wins were flat year on year.","Q3 concall p.8"]}},
TATAMOTORS:{n:"Tata Motors",s:"Passenger and commercial vehicles plus Jaguar Land Rover.",seg:[["Jaguar Land Rover",68],["Passenger vehicles",18],["Commercial vehicles",14]],fin:[["Revenue","₹4,40,000 cr"],["EBITDA margin","14.2%"],["PAT","₹31,000 cr"],["ROCE","19%"]],tr:{rev:[250,278,345,438,440],m:[8.1,8.9,11.4,14,14.2]},bs:[["Debt to equity","0.7",1],["Net debt","Down 18% this year",1],["Working capital days","Negative, suppliers fund it",1],["Funding","Bonds and bank loans",0]],cash:[["FY23",12,5],["FY24",34,31],["FY25",36,31]],nv:[["Says deleveraging is on track; net debt fell 18%.",1],["Says EV share will reach 10%; delivered 8.4%.",0]],
rows:[["Net debt","Reduce this year","Down 18%",1,"Q2 concall p.7"],["JLR EBIT margin","8.5%","7.6%",0,"Q3 concall p.3"],["EV share of sales","10%","8.4%",0,"Q4 concall p.9"]],bull:["Debt reduction ahead of plan"],bear:["Two of three headline targets missed"],qa:{debt:["Net debt guided lower; reported down 18%.","Q2 concall p.7"],ev:["Guided 10% EV share; delivered 8.4%.","Q4 concall p.9"],margin:["JLR EBIT margin guided 8.5%, delivered 7.6%.","Q3 concall p.3"]}},
DMART:{n:"Avenue Supermarts (not in your portfolio)",s:"Value retail chain that owns most of its stores.",seg:[["Foodstuff",55],["Non-food FMCG",25],["General merchandise",20]],fin:[["Revenue","₹59,000 cr"],["EBITDA margin","8.1%"],["PAT","₹2,700 cr"],["ROCE","15%"]],tr:{rev:[24,30,42,50,59],m:[7.9,8.6,8.9,8.4,8.1]},bs:[["Debt to equity","0.01",1],["Capex","Heavy, funded from cash flow",1],["Inventory days","32",1],["Funding","Internal accruals",1]],cash:[["FY23",1.9,1.5],["FY24",2.4,2.4],["FY25",3.1,2.7]],nv:[["Says store expansion is the growth engine; 44 added vs 50 guided.",0],["Says margins are stable near 8%; they slipped for two years.",0]],
rows:[["Store additions","50 a year","44",0,"Q2 concall p.3"],["Revenue growth","18–20%","17.6%",0,"Q1 concall p.5"],["EBITDA margin","About 8%","8.1%",1,"Q3 concall p.6"]],bull:["Debt free, expanding from cash flow"],bear:["Missed store and growth targets","Margin drifting down"],qa:{store:["Guided 50 additions a year; delivered 44.","Q2 concall p.3"],margin:["Guided about 8% EBITDA margin; delivered 8.1%.","Q3 concall p.6"]}}};
const S={t:"watch",sort:"A–Z",w:24,g:"All",vm:2,pm:3,ty:new Set(["results","management_change","M&A","fund_raise","litigation"]),read:new Set(),pin:new Set(),watch:new Set(["INFY"]),open:0,rt:"Business",rk:"",chat:[],rg:30};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=n=>n.toLocaleString("en-IN"),pc=n=>`<span class="${n>=0?"up":"dn"}">${n>=0?"+":""}${n.toFixed(2)}%</span>`;
function ser(t,n=90){let s=[...t].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7),v=[],p=D[t][1],c=D[t][2];for(let i=0;i<n;i++){s=(s*1664525+1013904223)>>>0;v.push((s/4294967296-.5))}let a=p/(1+c/100),o=[];let x=1;for(let i=n-1;i>=0;i--){o.unshift(a*x);x*=1+v[i]*.03}const k=p/o[n-1];return o.map(y=>y*k)}
function sp(v,w,h,sw=1.6){const mn=Math.min(...v),mx=Math.max(...v),up=v[v.length-1]>=v[0];return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--${up?"g":"r"})" stroke-width="${sw}" points="${v.map((y,i)=>(i/(v.length-1)*w).toFixed(1)+","+(h-2-(y-mn)/(mx-mn||1)*(h-4)).toFixed(1)).join(" ")}"/></svg>`}
const unusual=t=>D[t][3]>=S.vm||Math.abs(D[t][2])>=S.pm;
const score=f=>W[f.c]*(.5+.5*Math.exp(-f.h/48))+(unusual(f.t)?4:0)+(S.watch.has(f.t)?3:0)+(S.ty.has(f.c)?3:0)+(S.pin.has(f.id)?50:0);

function watch(){const k=Object.keys(D);const s={"A–Z":(a,b)=>a.localeCompare(b),"% change":(a,b)=>D[b][2]-D[a][2],"Volume":(a,b)=>D[b][3]-D[a][3]}[S.sort];k.sort(s);
return`<div class="sec"><h3>My watchlist</h3><span class="m">${k.filter(unusual).length} unusual today</span></div><div class="tabs">${["A–Z","% change","Volume"].map(x=>`<button class="p" data-sort="${x}" aria-pressed="${S.sort==x}">${x}</button>`).join("")}</div>
${k.map(t=>`<button class="row" data-open="${t}"><div><span class="n">${t}</span>${unusual(t)?'<span class="dot" title="Unusual move"></span>':""}<div class="m">${D[t][3]}× volume</div></div>${sp(ser(t,30),64,26)}<div class="r2"><div class="n ${D[t][2]>=0?"up":"dn"}">${fm(D[t][1])}</div>${pc(D[t][2])}</div></button>`).join("")}`}
function card(f){const r=S.read.has(f.id);return`<div class="card ${r?"rd":""}"><div class="row" style="padding:0;border:0"><span><b class="n" style="color:var(--hi)">${f.t}</b> <span class="tag">${f.c.replace("_"," ")}</span></span><span class="m">${f.h<24?f.h+"h":Math.round(f.h/24)+"d"} ago</span></div>
<h3 style="font-size:15px;margin:8px 0 4px">${f.x}</h3>${unusual(f.t)?`<span class="tag h">${D[f.t][2]>0?"+":""}${D[f.t][2]}% on ${D[f.t][3]}× volume</span>`:""}${f.y?`<div class="m" style="margin-top:6px">${f.y}</div>`:""}
${f.m?`<table><tr><th></th><th>₹ cr</th><th>QoQ</th><th>YoY</th></tr>${f.m.map(r=>`<tr><td>${r[0]}</td><td>${fm(r[1])}</td><td>${pc(r[2])}</td><td>${pc(r[3])}</td></tr>`).join("")}</table>`:""}${f.b?`<p style="margin:8px 0 0">${f.b}</p>`:""}
<div class="acts"><button data-open="${f.t}">View stock</button><button data-res="${f.t}">Research</button><button data-pin="${f.id}">${S.pin.has(f.id)?"Unpin":"Pin"}</button><button data-read="${f.id}">${r?"Unread":"Done"}</button></div></div>`}
function fd(){const L=F.filter(f=>f.h<=S.w&&(!G[S.g]||G[S.g].includes(f.c))).sort((a,b)=>score(b)-score(a)),key=L.filter(f=>W[f.c]>2),low=L.filter(f=>W[f.c]<=2);

function feed(){return`<label class="sl">Show the last <b>${S.w}h</b><input type="range" min="6" max="168" step="6" value="${S.w}" data-r="w"></label><div class="tabs">${[[24,"24h"],[72,"3 days"],[168,"7 days"]].map(([h,l])=>`<button class="p" data-w="${h}" aria-pressed="${S.w==h}">${l}</button>`).join("")}<button class="p" data-a="brief">Brief</button></div><div class="tabs">${Object.keys(G).map(g=>`<button class="p" data-g="${g}" aria-pressed="${S.g==g}">${g}</button>`).join("")}</div><div id="fd">${fd()}</div>`}

function research(){const k=S.rk.toUpperCase().trim(),r=R[k],c=Object.keys(D).filter(t=>t.startsWith(k)||D[t][0].toUpperCase().includes(k)).slice(0,6);

else b=`<div class="card"><h3>No research cached for ${esc(k)}</h3><p class="m">The engine works on any NSE ticker. Run <code>python research.py ${esc(k)}</code> to build its view from annual reports and concalls.</p>${c.length?c.map(t=>`<div class="m">Did you mean ${t}?</div>`).join(""):""}</div>`;
return`<input type="text" id="q" placeholder="Search any NSE ticker" value="${esc(S.rk)}" aria-label="Ticker">${b}`}
function bars(a,b){const mx=Math.max(...a,...b);return a.map((x,i)=>`<div style="display:flex;gap:4px;align-items:flex-end;height:60px;flex:1"><i style="flex:1;background:var(--b);height:${x/mx*100}%"></i><i style="flex:1;background:var(--g);height:${b[i]/mx*100}%"></i></div>`).join("")}
function rt(r,k){const T=S.rt,c=h=>`<div class="card">${h}</div>`,L=(a,b,t)=>`<div class="row" style="padding:8px 0"><span class="m">${a}</span><b class="${t==1?"up":t===0?"dn":""}">${b}</b></div>`;
if(T=="Business")return c(`<h3>Revenue mix</h3>`+r.seg.map(([n,p])=>`<div class="row" style="padding:8px 0 3px;border:0"><span>${n}</span><b>${p}%</b></div><i style="display:block;height:5px;width:${p}%;background:var(--b);border-radius:3px"></i>`).join(""));
if(T=="Financials")return c(`<h3>Latest year</h3>`+r.fin.map(([a,b])=>L(a,b)).join(""));
if(T=="Trajectory"){const v=r.tr.rev,g=(Math.pow(v[4]/v[0],.25)-1)*100,d=r.tr.m[4]-r.tr.m[0];return c(`<h3>Revenue</h3><div class="m">₹ ’000 cr, FY21 to FY25. Grew ${g.toFixed(1)}% a year.</div>${sp(v,300,70)}`)+c(`<h3>EBITDA margin</h3><div class="m">${d>=0?"Expanded":"Compressed"} ${Math.abs(d).toFixed(1)} points over four years.</div>${sp(r.tr.m,300,70)}`)}
if(T=="Balance sheet")return c(`<h3>Debt and funding</h3>`+r.bs.map(([a,b,t])=>L(a,b,t)).join(""));
if(T=="Cash quality")return c(`<h3>Operating cash vs profit</h3><div class="m">Blue: cash from operations. Green: PAT. ₹ ’000 cr.</div><div style="display:flex;gap:10px;margin:10px 0">${bars(r.cash.map(x=>x[1]),r.cash.map(x=>x[2]))}</div>`+r.cash.map(x=>L(x[0],Math.round(x[1]/x[2]*100)+"% of profit became cash",x[1]/x[2]>=.9?1:0)).join(""));
if(T=="Narrative vs numbers")return c(`<h3>Where the story and the numbers meet</h3>`+r.nv.map(([t,a])=>`<p><b class="${a?"up":"dn"}">${a?"Agrees":"Diverges"}</b> ${t}</p>`).join(""));
if(T=="Guidance")return c(`<h3>Promised vs delivered, last four quarters</h3><table><tr><th></th><th>Guided</th><th>Actual</th></tr>${r.rows.map(x=>`<tr><td>${x[0]}<div class="m">${x[4]}</div></td><td>${x[1]}</td><td class="${x[3]?"up":"dn"}">${x[2]}<div class="m">${x[3]?"Met":"Missed"}</div></td></tr>`).join("")}</table>`);
if(T=="Bull and bear")return c(`<h3 class="up">Bull</h3>${r.bull.map(x=>`<p>${x}</p>`).join("")}`)+c(`<h3 class="dn">Bear</h3>${r.bear.map(x=>`<p>${x}</p>`).join("")}`);
return`<div class="tabs"><button class="p" data-a="mic">Speak</button>${Object.keys(r.qa).map(q=>`<button class="p" data-qa="${q}">${q}</button>`).join("")}</div>${S.chat.map(c=>`<div class="bub ${c[0]}">${c[1]}${c[2]?`<div class="m">${c[2]}</div>`:""}</div>`).join("")}<input type="text" id="ask" placeholder="Ask about guidance, e.g. attrition" aria-label="Ask">`}
function hold(){let inv=0,cur=0,day=0,sec={};Object.values(D).forEach(d=>{inv+=d[5]*d[6];cur+=d[5]*d[1];day+=d[5]*d[1]*d[2]/100;sec[d[4]]=(sec[d[4]]||0)+d[5]*d[1]});const col=["#5367FF","#00B386","#F5A524","#EB5B3C","#8A5CF6","#2BB5D9","#B0B3C0"],ks=Object.keys(sec).sort((a,b)=>sec[b]-sec[a]);
return`<div class="sec"><h3>Current value</h3></div><div style="padding:0 16px"><div class="big">₹${fm(Math.round(cur))}</div><div>${pc((cur/inv-1)*100)} overall <span class="m">invested ₹${fm(Math.round(inv))}</span></div><div>${day>=0?"+":""}₹${fm(Math.round(day))} today</div></div>
<div class="sec"><h3>By sector</h3></div><div class="alloc">${ks.map((k,i)=>`<div title="${k}" style="width:${sec[k]/cur*100}%;background:${col[i%7]}"></div>`).join("")}</div><div class="m" style="padding:0 16px">${ks.slice(0,4).map(k=>`${k} ${Math.round(sec[k]/cur*100)}%`).join("   ")}</div>
<div class="sec"><h3>Holdings</h3></div>${Object.keys(D).map(t=>{const d=D[t];return`<button class="row" data-open="${t}"><div><span class="n">${t}</span><div class="m">${d[5]} shares, avg ${fm(d[6])}</div></div><div class="r2"><div class="n">₹${fm(Math.round(d[5]*d[1]))}</div>${pc((d[1]/d[6]-1)*100)}</div></button>`}).join("")}`}
function sheet(t){const d=D[t],v=ser(t),r=S.rg,fs=F.filter(f=>f.t==t);$("#sc").innerHTML=`<div class="bar"><div><h2>${t}</h2><div class="m">${d[0]}, ${d[4]}</div></div><button class="ic" data-close aria-label="Close">✕</button></div>
<div style="padding:0 16px"><div class="big">₹${fm(d[1])}</div>${pc(d[2])}</div><div style="padding:8px 16px">${sp(v.slice(-r),340,110,2)}</div>
<div class="tabs">${[[7,"1W"],[30,"1M"],[90,"3M"]].map(([n,l])=>`<button class="p" data-rg="${n}" data-sym="${t}" aria-pressed="${r==n}">${l}</button>`).join("")}</div>
<div class="row"><span class="m">Volume vs average</span><b>${d[3]}×</b></div><div class="row"><span class="m">Your holding</span><b>${d[5]} shares, ${pc((d[1]/d[6]-1)*100)}</b></div>
<div class="sec"><h3>Recent filings</h3></div>${fs.map(f=>`<div class="row"><span>${f.x}<div class="m">${f.c.replace("_"," ")}</div></span><span class="m">${f.h}h</span></div>`).join("")||'<p class="m" style="padding:0 16px">No filings in the last 7 days.</p>'}
<div class="acts" style="padding:12px 16px"><button data-res="${t}">Research</button><button data-w2="${t}">${S.watch.has(t)?"Stop watching":"Watch"}</button></div>`;$("#sh").classList.add("on");S.sym=t}
const nAl=()=>Object.keys(D).filter(unusual).length+F.filter(f=>f.h<=24&&S.ty.has(f.c)).length;
function bell(){$("#bd").textContent=nAl()}
let tm;function toast(m){const t=$("#tt");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),2200)}
function sh2(h,b){$("#sc").innerHTML=`<div class="bar"><h2>${h}</h2><button class="ic" data-close aria-label="Close">✕</button></div>`+b;$("#sh").classList.add("on")}
function alSheet(){const a=F.filter(f=>f.h<=24&&S.ty.has(f.c));sh2("Alerts",`<div class="sec"><h3>Filings you flagged, last 24h</h3></div>${a.map(f=>`<button class="row" data-open="${f.t}"><span><b>${f.t}</b> <span class="tag">${f.c.replace("_"," ")}</span><div class="m">${f.x}</div></span><span class="m">${f.h}h</span></button>`).join("")||'<p class="m" style="padding:0 16px">None.</p>'}${hits()}`)}
function briefSheet(){const L=F.filter(f=>f.h<=S.w&&W[f.c]>2).sort((a,b)=>score(b)-score(a)).slice(0,5);sh2("Brief",`<div id="bt" class="card"><b style="color:var(--hi)">FINN brief, last ${S.w}h</b>${L.map(f=>`<p style="margin:8px 0">${f.t}: ${f.x}. ${f.y||""}</p>`).join("")}</div><div class="acts" style="padding:0 16px"><button data-a="cp">Copy</button></div>`)}
function infoSheet(){sh2("How FINN keeps cost low",`<div class="card"><table><tr><th>Step</th><th>Tool</th></tr><tr><td>Classify filings</td><td>Keyword rules; small model only if unsure</td></tr><tr><td>Results numbers</td><td>Small model on table pages only</td></tr><tr><td>Manager bios</td><td>Small model with web search</td></tr><tr><td>Guidance vs delivery</td><td>Strong model, once per company</td></tr></table><p class="m">Every output is cached by document hash, so nothing is read twice. Research uses annual reports and concalls only.</p></div>`)}
function mic(){const V=window.SpeechRecognition||window.webkitSpeechRecognition;if(!V)return toast("Voice isn’t supported in this browser");const r=new V();r.lang="en-IN";r.onresult=e=>{const i=$("#ask");i.value=e.results[0][0].transcript;i.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true}))};r.start();toast("Listening")}
function draw(){$("#v").innerHTML={watch,feed,research,alerts,hold}[S.t]();document.querySelectorAll("#nv button").forEach(b=>b.setAttribute("aria-current",b.dataset.t==S.t?"page":"false"))}
document.addEventListener("click",e=>{const b=e.target.closest("button"),sh=e.target.id=="sh";if(sh)return $("#sh").classList.remove("on");if(!b)return;const d=b.dataset;
if(d.close!==undefined)return $("#sh").classList.remove("on");
if(d.open)return sheet(d.open);if(d.rg){S.rg=+d.rg;return sheet(d.sym)}
if(d.w2){S.watch.has(d.w2)?S.watch.delete(d.w2):S.watch.add(d.w2);sheet(d.w2);return draw()}
if(d.a=="al")return alSheet();if(d.a=="info")return infoSheet();if(d.a=="brief")return briefSheet();if(d.a=="cp"){navigator.clipboard&&navigator.clipboard.writeText($("#bt").innerText).catch(()=>{});return toast("Brief copied")}if(d.a=="mic")return mic();if(d.a=="th"){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark";return}
if(d.res){$("#sh").classList.remove("on");S.t="research";S.rk=d.res;S.rt="Business";S.chat=[]}
if(d.t)S.t=d.t;if(d.sort)S.sort=d.sort;if(d.w)S.w=+d.w;if(d.g)S.g=d.g;if(d.ty)S.ty.has(d.ty)?S.ty.delete(d.ty):S.ty.add(d.ty);if(d.rt)S.rt=d.rt;
if(d.pin)S.pin.has(+d.pin)?S.pin.delete(+d.pin):S.pin.add(+d.pin);if(d.read){S.read.has(+d.read)?S.read.delete(+d.read):S.read.add(+d.read)}
if("fold"in d)S.open=!S.open;if(d.qa){const r=R[S.rk.toUpperCase()],a=r.qa[d.qa];S.chat.push(["me","What about "+d.qa+"?"],["",a[0],a[1]])}draw()});
document.addEventListener("input",e=>{const i=e.target;if(i.dataset.r){const k=i.dataset.r;S[k]=+i.value;i.parentNode.querySelector("b").textContent=i.value+(k=="vm"?"×":k=="w"?"h":"%");if(k=="w")$("#fd").innerHTML=fd();else{$("#hits").innerHTML=hits();toast(nAl()+" alerts trigger now")}bell()}
if(i.id=="q"){S.rk=i.value;const p=i.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="ask"){const r=R[S.rk.toUpperCase()],q=e.target.value.toLowerCase(),h=Object.keys(r.qa).find(k=>q.includes(k));S.chat.push(["me",esc(e.target.value)],h?["",r.qa[h][0],r.qa[h][1]]:["","Not covered in the cached documents. Nothing is answered from outside them.",""]);draw();$("#ask").focus()}if(e.key=="Escape")$("#sh").classList.remove("on")});
ix();draw();bell();
</script></body></html>
